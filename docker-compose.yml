# Полный контур платформы: API, воркер, PostgreSQL и Redis.
#
# API и воркер — разные процессы одного образа. Это и есть смысл очереди:
# API отвечает мгновенно, воркер можно перезапускать и масштабировать
# (`docker compose up -d --scale worker=3`), а состояние задачи живёт в базе,
# поэтому масштабирование ничего не теряет.

x-app: &app
  build: .
  env_file: .env
  environment:
    AAP_DATABASE_URL: postgresql://aap:aap@postgres:5432/aap
    AAP_QUEUE: redis
    AAP_REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: python -m app.worker
    # Воркеру не нужен порт: он только берёт задачи из очереди.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aap
      POSTGRES_PASSWORD: aap
      POSTGRES_DB: aap
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aap -d aap"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
