[project]
name = "ai-automation-platform"
version = "1.0.0"
description = "Платформа автоматизации: задача → план агента → инструменты → результат"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Правила выбраны так, чтобы линтер ловил реальные ошибки (неиспользуемые импорты
# и переменные, тень, мутабельные значения по умолчанию, неразобранные импорты),
# а не спорил о стиле: UP/SIM/RUF включают десятки придирок вида «используйте
# collections.abc вместо typing», которые не влияют на работу кода.
select = ["E", "F", "W", "I", "B", "C4"]
ignore = [
    "E501",   # длинные строки: русские докстринги и сообщения важнее 120 символов
    "RUF001", # кириллица в строках — это нормальный текст интерфейса
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # helpers добавляет корень проекта в sys.path до импортов

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
